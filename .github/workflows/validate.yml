name: Validate shared deployment

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: python -m pip install PyYAML==6.0.3
      - run: python scripts/validate.py --shared-only
      - run: python -m unittest discover -s tests -v

  terraform:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        directory: [terraform/bootstrap, terraform/modules/cloud-run-service, terraform/modules/cloud-run-job]
    defaults:
      run:
        working-directory: ${{ matrix.directory }}
    steps:
      - uses: actions/checkout@v6
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: '1.9.8'
      - run: terraform init -backend=false -input=false
      - run: terraform validate
